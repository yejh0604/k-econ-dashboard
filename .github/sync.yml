name: Economic Data Autonomous Sync

on:
  schedule:
    # 1) 매일 08:05 KST (UTC 23:05) - 통계청/한국은행 조간 발표 대응
    - cron: '5 23 * * *'
    # 2) 매월 1일 09:05 KST (UTC 00:05) - 산업부 조간 엠바고 대응
    - cron: '5 0 1 * *'
    # 3) 매월 1일 11:05 KST (UTC 02:05) - 산업부 11시 발표 대응
    - cron: '5 2 1 * *'
  workflow_dispatch: # Actions 탭에서 [Run workflow] 버튼으로 즉시 수동 실행 가능

permissions:
  contents: write

jobs:
  collect-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: pip install requests beautifulsoup4

      - name: 경제지표 데이터 수집 실행
        env:
          BOK_API_KEY: ${{ secrets.BOK_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python collector.py

      - name: 변경 사항 커밋 및 푸시
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "EconDataBot"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update: 최신 경제지표 동기화 [skip ci]" && git push)
