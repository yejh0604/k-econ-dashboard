<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대한민국 거시경제지표 실시간 종합 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <!-- 상단 헤더 -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40 px-6 py-4">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-3">
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse mr-1.5"></span> LIVE SYNC
          </span>
          <h1 class="text-xl font-bold tracking-tight text-white">대한민국 거시경제지표 모니터링 허브</h1>
        </div>
        <p class="text-xs text-slate-400 mt-1">한국은행(ECOS) · 국가데이터처(KOSIS/MODS) · 산업통상자원부 공식 공표 통계</p>
      </div>
      <div class="flex items-center gap-4 text-xs">
        <div class="bg-slate-800 px-3 py-2 rounded-lg border border-slate-700">
          <span class="text-slate-400">최종 동기화:</span>
          <span id="lastUpdated" class="font-mono text-emerald-400 font-bold ml-1">로딩 중...</span>
        </div>
        <button onclick="fetchLatestData()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition flex items-center gap-1.5">
          <i class="fa-solid fa-arrows-rotate"></i> 새로고침
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 대시보드 영역 -->
  <main class="max-w-7xl mx-auto px-6 py-8">
    <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- 자바스크립트로 카드가 동적 생성됩니다 -->
    </div>
  </main>

  <script>
    async function fetchLatestData() {
      try {
        // 캐시 우회를 위해 쿼리스트링에 타임스탬프 부여
        const res = await fetch('./data.json?t=' + Date.now());
        const data = await res.json();
        
        document.getElementById('lastUpdated').innerText = data.updated_at || '최근 동기화됨';
        renderCards(data.indicators);
      } catch (err) {
        console.error('데이터 로드 실패:', err);
        document.getElementById('lastUpdated').innerText = '데이터 로드 대기 중';
      }
    }

    function renderCards(indicators) {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      const items = [
        { key: 'cpi', title: '소비자물가동향', data: indicators.cpi, unit: 'p', diffLabel: 'MoM', yoyLabel: 'YoY' },
        { key: 'employment', title: '고용동향', data: indicators.employment, unit: '만 명', isEmp: true },
        { key: 'export', title: '수출입동향', data: indicators.export, unit: '억 달러', isExport: true },
        { key: 'production', title: '산업활동동향', data: indicators.production, unit: 'p', diffLabel: 'MoM', yoyLabel: 'YoY' },
        { key: 'gdp', title: '실질 GDP 성장률', data: indicators.gdp, unit: '%', diffLabel: 'QoQ', yoyLabel: 'YoY' },
        { key: 'outlook', title: '한국은행 경제전망', data: indicators.outlook, isOutlook: true }
      ];

      items.forEach(item => {
        if (!item.data) return;
        const card = createCardElement(item);
        grid.appendChild(card);
      });
    }

    function createCardElement(item) {
      const d = item.data;
      const el = document.createElement('div');
      el.className = 'bg-slate-800/80 border border-slate-700/80 rounded-xl p-5 hover:border-slate-600 transition flex flex-col justify-between';

      let badgesHtml = '';
      let valueHtml = '';

      if (item.isOutlook) {
        valueHtml = `<div class="text-3xl font-extrabold text-indigo-400 mt-2">${d.growth_2026}% <span class="text-sm font-normal text-slate-400">(2026 전망)</span></div>`;
        badgesHtml = `<span class="px-2 py-0.5 rounded bg-purple-500/20 text-purple-300 text-xs">물가전망 ${d.cpi_2026}%</span>`;
      } else if (item.isEmp) {
        valueHtml = `<div class="text-3xl font-extrabold text-white mt-2">${d.value.toLocaleString()} <span class="text-sm font-normal text-slate-400">${item.unit}</span></div>`;
        badgesHtml = `
          <span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 text-xs font-semibold">증감 +${d.yoy_diff}만 명</span>
          <span class="px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 text-xs">고용률 ${d.rate_15_64}%</span>
        `;
      } else if (item.isExport) {
        const flashTag = d.is_flash ? '<span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 text-xs border border-amber-500/30">속보 잠정</span>' : '';
        valueHtml = `<div class="text-3xl font-extrabold text-white mt-2">${d.value.toLocaleString()} <span class="text-sm font-normal text-slate-400">${item.unit}</span></div>`;
        badgesHtml = `
          ${flashTag}
          <span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 text-xs font-semibold">YoY +${d.yoy}%</span>
          <span class="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 text-xs">흑자 ${d.balance}억$</span>
        `;
      } else {
        valueHtml = `<div class="text-3xl font-extrabold text-white mt-2">${d.value} <span class="text-sm font-normal text-slate-400">${item.unit}</span></div>`;
        const diffVal = d.mom !== undefined ? d.mom : d.qoq;
        badgesHtml = `
          <span class="px-2 py-0.5 rounded bg-slate-700 text-slate-300 text-xs font-semibold">${item.diffLabel} ${diffVal > 0 ? '+' : ''}${diffVal}%</span>
          <span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 text-xs font-semibold">YoY +${d.yoy}%</span>
        `;
      }

      let detailsListHtml = '';
      if (d.details && d.details.length > 0) {
        detailsListHtml = `
          <div class="mt-4 pt-3 border-t border-slate-700/60 grid grid-cols-2 gap-2 text-xs">
            ${d.details.map(sub => `
              <div class="bg-slate-900/50 p-2 rounded border border-slate-800">
                <span class="text-slate-400 block truncate">${sub.name}</span>
                <span class="font-semibold text-slate-200">${sub.val}</span>
              </div>
            `).join('')}
          </div>
        `;
      }

      el.innerHTML = `
        <div>
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">${d.period || ''} 기준</span>
            <div class="flex items-center gap-1.5">${badgesHtml}</div>
          </div>
          <h2 class="text-base font-bold text-slate-100 mt-1">${item.title}</h2>
          ${valueHtml}
          ${detailsListHtml}
        </div>
        <div class="mt-4 pt-3 border-t border-slate-700/40 flex items-center justify-between text-xs text-slate-400">
          <span>출처: <span class="text-slate-300">${d.source}</span></span>
          <a href="${d.source_url}" target="_blank" class="text-indigo-400 hover:text-indigo-300 flex items-center gap-1">
            원문 <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
          </a>
        </div>
      `;
      return el;
    }

    window.onload = fetchLatestData;
  </script>
</body>
</html>
